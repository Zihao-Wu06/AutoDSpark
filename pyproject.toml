[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "autodspark"
version = "0.1.0"
description = "One command to train a DSpark speculative-decoding drafter for your own model, built on vLLM Speculators."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "AutoDSpark contributors" }]
keywords = ["llm", "speculative-decoding", "dspark", "vllm", "inference", "draft-model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Kept deliberately light: AutoDSpark only plans and orchestrates.
# The heavy lifting (vLLM, Speculators, torch) runs in separate environments
# that `autodspark setup` creates, so their pins never fight each other.
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.5",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
hf = ["huggingface_hub>=0.24"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
autodspark = "autodspark.cli:app"

[project.urls]
Homepage = "https://github.com/Zihao-Wu06/AutoDSpark"
Issues = "https://github.com/Zihao-Wu06/AutoDSpark/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/autodspark"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
